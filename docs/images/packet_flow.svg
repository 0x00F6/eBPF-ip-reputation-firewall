<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Filters -->
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#0ea5e9" flood-opacity="0.6"/>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#a855f7" flood-opacity="0.6"/>
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.8"/>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.8"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="card-start" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#07101e"/>
    </linearGradient>
    <linearGradient id="card-decision" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0e0a29"/>
    </linearGradient>
    <linearGradient id="card-drop-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#240404"/>
    </linearGradient>
    <linearGradient id="card-accept-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#02281e"/>
    </linearGradient>

    <!-- Arrowheads -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>

    <!-- Background Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.6"/>
    </pattern>

    <!-- Icons -->
    <g id="icon-nic">
      <rect x="3" y="5" width="18" height="12" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6"/>
      <rect x="6" y="8" width="5" height="6" fill="#0284c7"/>
      <line x1="14" y1="7" x2="18" y2="7" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="14" y1="10" x2="18" y2="10" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="14" y1="13" x2="18" y2="13" stroke="#38bdf8" stroke-width="1.5"/>
    </g>

    <g id="icon-drop">
      <path d="M12 3 L19 6 v6 c0 4.5-3 7.5-7 9 c-4-1.5-7-4.5-7-9 V6 z" fill="#ef4444" opacity="0.3"/>
      <path d="M12 3 L19 6 v6 c0 4.5-3 7.5-7 9 c-4-1.5-7-4.5-7-9 V6 z" fill="none" stroke="#ef4444" stroke-width="1.8"/>
      <line x1="9" y1="9" x2="15" y2="15" stroke="#fee2e2" stroke-width="2" stroke-linecap="round"/>
      <line x1="15" y1="9" x2="9" y2="15" stroke="#fee2e2" stroke-width="2" stroke-linecap="round"/>
    </g>

    <g id="icon-pass">
      <path d="M12 3 L19 6 v6 c0 4.5-3 7.5-7 9 c-4-1.5-7-4.5-7-9 V6 z" fill="#10b981" opacity="0.3"/>
      <path d="M12 3 L19 6 v6 c0 4.5-3 7.5-7 9 c-4-1.5-7-4.5-7-9 V6 z" fill="none" stroke="#10b981" stroke-width="1.8"/>
      <path d="M8.5 12 l2.5 2.5 l5-5" fill="none" stroke="#ecfdf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="icon-ringbuf">
      <circle cx="12" cy="12" r="8" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="3 2"/>
      <circle cx="12" cy="4" r="2" fill="#a855f7"/>
      <circle cx="20" cy="12" r="2" fill="#c084fc"/>
      <circle cx="12" cy="20" r="2" fill="#e879f9"/>
      <circle cx="4" cy="12" r="2" fill="#a855f7"/>
    </g>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#090d16"/>
  <rect width="100%" height="100%" fill="url(#dot-grid)"/>

  <!-- ==================== HEADER BAR ==================== -->
  <g transform="translate(40, 22)">
    <text x="0" y="24" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="0.5">
      INGRESS PACKET EVALUATION FLOW
      <tspan font-size="16" font-weight="400" fill="#94a3b8"> — eBPF / XDP Pipeline</tspan>
    </text>
    <text x="0" y="44" font-size="12" font-weight="500" fill="#64748b">
      Sub-Microsecond Wire-Speed Decision Tree Before Linux Socket Buffer (sk_buff) Allocation
    </text>

    <!-- Top Status Badges -->
    <g transform="translate(680, 5)">
      <rect width="170" height="26" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
      <text x="14" y="17" font-size="11" font-weight="700" fill="#c7d2fe">⚡ Sub-Microsecond Drop</text>
      
      <rect x="180" width="180" height="26" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="194" y="17" font-size="11" font-weight="700" fill="#a7f3d0">🚀 15-40 Mpps / Core (XDP)</text>
    </g>
  </g>

  <!-- ==================== MAIN FLOW CONTAINER ==================== -->
  <g transform="translate(40, 85)">
    <!-- Container Outline -->
    <rect width="1020" height="715" rx="14" fill="#0d1424" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>

    <!-- ==================== CENTRAL PIPELINE ==================== -->

    <!-- NODE 1: Ingress Frame at NIC -->
    <g transform="translate(340, 20)">
      <rect width="340" height="60" rx="10" fill="url(#card-start)" stroke="#38bdf8" stroke-width="2" filter="url(#glow-cyan)"/>
      <use href="#icon-nic" x="14" y="18" width="24" height="24"/>
      <text x="46" y="27" font-size="13" font-weight="700" fill="#f8fafc">1. Incoming Frame at NIC RX Ring</text>
      <text x="46" y="46" font-size="10.5" font-weight="500" fill="#7dd3fc">Hardware/Driver Layer • Wire Speed Ingress</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="510" y1="80" x2="510" y2="108" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

    <!-- NODE 2: L2 Ethernet & 802.1Q Parse -->
    <g transform="translate(340, 110)">
      <rect width="340" height="60" rx="10" fill="url(#card-step)" stroke="#0284c7" stroke-width="1.6" filter="url(#shadow)"/>
      <rect x="14" y="15" width="26" height="26" rx="6" fill="#0369a1" fill-opacity="0.4"/>
      <text x="21" y="32" font-size="12" font-weight="700" fill="#38bdf8">L2</text>
      <text x="48" y="27" font-size="12.5" font-weight="700" fill="#f8fafc">2. Parse Ethernet &amp; 802.1Q VLAN</text>
      <text x="48" y="46" font-size="10.5" font-family="monospace" fill="#94a3b8">EthType check • QinQ Tag Parsing (802.1ad)</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="510" y1="170" x2="510" y2="198" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

    <!-- NODE 3: IP Protocol Decision -->
    <g transform="translate(350, 200)">
      <polygon points="160,0 320,40 160,80 0,40" fill="url(#card-decision)" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
      <text x="160" y="35" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f8fafc">3. Is IPv4 or IPv6 Packet?</text>
      <text x="160" y="52" text-anchor="middle" font-size="10" font-family="monospace" fill="#a5b4fc">0x0800 (IPv4) | 0x86DD (IPv6)</text>
    </g>

    <!-- Branch Non-IP (ARP, LLDP...) -> PASS on LEFT -->
    <path d="M 350 240 L 170 240 L 170 515" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
    <g transform="translate(195, 218)">
      <rect width="135" height="20" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="8" y="14" font-size="9.5" font-weight="700" fill="#a7f3d0">Non-IP (ARP, LLDP, STP)</text>
    </g>

    <!-- Arrow 3 -> 4 (IPv4 / IPv6 Yes) -->
    <line x1="510" y1="280" x2="510" y2="308" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <g transform="translate(518, 286)">
      <rect width="70" height="18" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
      <text x="6" y="13" font-size="9.5" font-weight="700" fill="#c7d2fe">IPv4 / IPv6</text>
    </g>

    <!-- NODE 4: L4 Extraction -->
    <g transform="translate(340, 310)">
      <rect width="340" height="58" rx="10" fill="url(#card-step)" stroke="#6366f1" stroke-width="1.6" filter="url(#shadow)"/>
      <rect x="14" y="14" width="26" height="26" rx="6" fill="#312e81"/>
      <text x="21" y="31" font-size="12" font-weight="700" fill="#a5b4fc">L4</text>
      <text x="48" y="26" font-size="12.5" font-weight="700" fill="#f8fafc">4. Extract L4 Protocol &amp; Ports</text>
      <text x="48" y="44" font-size="10.5" fill="#cbd5e1">TCP / UDP (Src/Dst Ports) • ICMP / ICMPv6</text>
    </g>

    <!-- Arrow 4 -> 5 -->
    <line x1="510" y1="368" x2="510" y2="396" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow-purple)"/>

    <!-- NODE 5: Tier 1 Exact Match Decision -->
    <g transform="translate(330, 400)">
      <polygon points="180,0 360,45 180,90 0,45" fill="url(#card-decision)" stroke="#c084fc" stroke-width="2" filter="url(#glow-purple)"/>
      <text x="180" y="36" text-anchor="middle" font-size="13" font-weight="800" fill="#f8fafc">5. Tier 1: Exact Hash Match?</text>
      <text x="180" y="54" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#e9d5ff">BPF_MAP_TYPE_HASH • O(1) Lookup</text>
      <text x="180" y="69" text-anchor="middle" font-size="9" fill="#c084fc">IPV4_EXACT_MAP (/32) | IPV6_EXACT_MAP (/128)</text>
    </g>

    <!-- Arrow Tier 1 Match -> DROP (RIGHT) -->
    <path d="M 690 445 L 800 445 L 800 350 L 828 350" fill="none" stroke="#ef4444" stroke-width="2.2" marker-end="url(#arrow-red)"/>
    <g transform="translate(705, 425)">
      <rect width="85" height="18" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
      <text x="8" y="13" font-size="9.5" font-weight="800" fill="#fca5a5">🚫 Match (/32)</text>
    </g>

    <!-- Arrow 5 -> 6 (Tier 1 Miss) -->
    <line x1="510" y1="490" x2="510" y2="528" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)"/>
    <g transform="translate(518, 500)">
      <rect width="85" height="18" rx="4" fill="#082f49" stroke="#38bdf8" stroke-width="1"/>
      <text x="6" y="13" font-size="9" font-weight="700" fill="#7dd3fc">⚡ Miss (Subnet?)</text>
    </g>

    <!-- NODE 6: Tier 2 LPM Match Decision -->
    <g transform="translate(330, 530)">
      <polygon points="180,0 360,45 180,90 0,45" fill="url(#card-decision)" stroke="#0ea5e9" stroke-width="2" filter="url(#glow-cyan)"/>
      <text x="180" y="36" text-anchor="middle" font-size="13" font-weight="800" fill="#f8fafc">6. Tier 2: LPM Trie CIDR Match?</text>
      <text x="180" y="54" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#7dd3fc">BPF_MAP_TYPE_LPM_TRIE • Prefix Match</text>
      <text x="180" y="69" text-anchor="middle" font-size="9" fill="#38bdf8">IPV4_LPM_MAP (/8, /24) | IPV6_LPM_MAP (/32, /48)</text>
    </g>

    <!-- Arrow Tier 2 Match -> DROP (RIGHT) -->
    <path d="M 690 575 L 800 575 L 800 375 L 828 375" fill="none" stroke="#ef4444" stroke-width="2.2" marker-end="url(#arrow-red)"/>
    <g transform="translate(705, 555)">
      <rect width="85" height="18" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
      <text x="8" y="13" font-size="9.5" font-weight="800" fill="#fca5a5">🚫 Match (CIDR)</text>
    </g>

    <!-- Arrow Tier 2 No Match -> ACCEPT (BOTTOM / LEFT) -->
    <path d="M 510 620 L 510 655 L 290 655 L 290 585" fill="none" stroke="#10b981" stroke-width="2.2" marker-end="url(#arrow-green)"/>
    <g transform="translate(360, 635)">
      <rect width="120" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="6" y="13" font-size="9" font-weight="700" fill="#6ee7b7">✅ Clean IP (No Match)</text>
    </g>

    <!-- ==================== VERDICT: XDP_DROP (RIGHT PANEL) ==================== -->
    <g transform="translate(830, 245)">
      <rect width="170" height="340" rx="12" fill="url(#card-drop-panel)" stroke="#ef4444" stroke-width="2" filter="url(#glow-red)"/>
      <use href="#icon-drop" x="16" y="16" width="30" height="30"/>
      <text x="52" y="36" font-size="16" font-weight="900" fill="#fca5a5">XDP_DROP</text>
      <text x="16" y="64" font-size="11" font-weight="700" fill="#fee2e2">Driver-Level Wire Discard</text>

      <!-- Details bullets -->
      <g transform="translate(14, 80)">
        <rect width="142" height="42" rx="5" fill="#2d0606" stroke="#991b1b" stroke-width="1"/>
        <text x="8" y="16" font-size="9.5" font-weight="700" fill="#fca5a5">⚡ Zero Kernel Alloc</text>
        <text x="8" y="32" font-size="8.5" fill="#f87171">No sk_buff created</text>
      </g>

      <g transform="translate(14, 130)">
        <rect width="142" height="60" rx="5" fill="#2d0606" stroke="#991b1b" stroke-width="1"/>
        <text x="8" y="16" font-size="9.5" font-weight="700" fill="#fca5a5">📡 RingBuffer Event</text>
        <text x="8" y="32" font-size="8.5" fill="#fca5a5">64-byte PacketLogEvent</text>
        <text x="8" y="46" font-size="8" font-family="monospace" fill="#cbd5e1">Src/Dst IP, Port, Proto</text>
      </g>

      <g transform="translate(14, 200)">
        <rect width="142" height="45" rx="5" fill="#2d0606" stroke="#991b1b" stroke-width="1"/>
        <text x="8" y="16" font-size="9.5" font-weight="700" fill="#fca5a5">📊 Atomic Counters</text>
        <text x="8" y="32" font-size="8.5" fill="#cbd5e1">Increments STATS map</text>
      </g>

      <g transform="translate(14, 255)">
        <rect width="142" height="65" rx="5" fill="#2d0606" stroke="#ef4444" stroke-width="1"/>
        <text x="8" y="18" font-size="10" font-weight="800" fill="#ef4444">🎯 Wire Protection</text>
        <text x="8" y="36" font-size="8.5" fill="#fecaca">Sub-microsecond</text>
        <text x="8" y="50" font-size="8.5" fill="#fecaca">CPU caches protected</text>
      </g>
    </g>

    <!-- ==================== VERDICT: XDP_PASS (LEFT PANEL) ==================== -->
    <g transform="translate(20, 520)">
      <rect width="270" height="150" rx="12" fill="url(#card-accept-panel)" stroke="#10b981" stroke-width="2" filter="url(#glow-green)"/>
      <use href="#icon-pass" x="16" y="16" width="30" height="30"/>
      <text x="52" y="36" font-size="16" font-weight="900" fill="#6ee7b7">XDP_PASS</text>
      <text x="16" y="64" font-size="11" font-weight="700" fill="#ecfdf5">Forward to Linux Kernel Stack</text>

      <g transform="translate(14, 76)">
        <rect width="242" height="60" rx="5" fill="#022c22" stroke="#047857" stroke-width="1"/>
        <text x="10" y="18" font-size="10" font-weight="700" fill="#a7f3d0">📦 Allocates Socket Buffer</text>
        <text x="10" y="34" font-size="9" fill="#cbd5e1">Creates sk_buff • Traverses Netfilter/iptables</text>
        <text x="10" y="48" font-size="9" fill="#6ee7b7">Delivered to Local Listening Sockets</text>
      </g>
    </g>
  </g>
</svg>