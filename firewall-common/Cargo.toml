[package]
name = "firewall-common"
version = "0.1.0"
edition = "2021"
authors = ["Firewall Team"]
description = "Common data structures and constants shared between eBPF kernel and user space"

[lib]
name = "firewall_common"
path = "src/lib.rs"
bench = false

[features]
default = ["std"]
std = []
serde = ["dep:serde"]
aya = ["dep:aya"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
aya = { version = "0.14.0", default-features = false, optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1.0"

[[bench]]
name = "common_benchmark"
harness = false
