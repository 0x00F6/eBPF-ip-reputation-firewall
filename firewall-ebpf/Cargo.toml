[workspace]

[package]
name = "firewall-ebpf"
version = "0.1.0"
edition = "2021"

[dependencies]
aya-ebpf = "0.2.1"
firewall-common = { path = "../firewall-common", default-features = false }

[lib]
name = "firewall_ebpf"
path = "src/lib.rs"
bench = false

[[bin]]
name = "firewall-ebpf"
path = "src/main.rs"
bench = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
libc = "0.2"

[[bench]]
name = "ebpf_benchmark"
harness = false

[profile.release]
opt-level = 3
debug = 2
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1

[profile.dev]
opt-level = 2
debug = 2
debug-assertions = false
overflow-checks = false
panic = "abort"
incremental = false
codegen-units = 1
